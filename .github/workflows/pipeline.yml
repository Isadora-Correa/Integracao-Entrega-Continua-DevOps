name: CI/CD - Documentação DevOps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Preparar a documentação
        run: |
          mkdir -p dist
          cp README.md dist/index.md
          cp -R Aula* dist/
          printf '%s\n' 'title: Integração e Entrega Contínua — DevOps' > dist/_config.yml
          test -f dist/index.md
          test -f dist/Aula06/Tarefa06/Atividade06.md

      - name: Salvar arquivos preparados
        uses: actions/upload-artifact@v4
        with:
          name: site-documentacao
          path: dist
          retention-days: 7

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Validar estrutura e links locais
        shell: python
        run: |
          from pathlib import Path
          import re

          errors = []
          root = Path.cwd()
          activities = sorted(root.glob("Aula*/Tarefa*/Atividade*.md"))

          if len(activities) < 6:
              errors.append("Devem existir pelo menos seis atividades documentadas.")

          link_pattern = re.compile(r"\[[^]]*\]\((?:<)?([^)>]+)(?:>)?\)")
          for markdown in root.rglob("*.md"):
              content = markdown.read_text(encoding="utf-8")
              for target in link_pattern.findall(content):
                  if target.startswith(("http://", "https://", "#")):
                      continue
                  if not (markdown.parent / target).resolve().exists():
                      errors.append(f"Link quebrado em {markdown}: {target}")

          if errors:
              raise SystemExit("\n".join(errors))
          print(f"{len(activities)} atividades e links locais validados.")

  quality:
    name: Quality
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Verificar o padrão dos arquivos Markdown
        shell: python
        run: |
          from pathlib import Path

          errors = []
          for markdown in Path.cwd().rglob("*.md"):
              lines = markdown.read_text(encoding="utf-8").splitlines()
              if not lines or not lines[0].startswith("# "):
                  errors.append(f"Título principal ausente em {markdown}")
              for number, line in enumerate(lines, start=1):
                  if line.endswith((" ", "\t")):
                      errors.append(f"Espaço excedente em {markdown}:{number}")

          if errors:
              raise SystemExit("\n".join(errors))
          print("Padrão Markdown validado.")

  security:
    name: Security
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Procurar credenciais expostas
        shell: python
        run: |
          from pathlib import Path
          import re

          patterns = {
              "chave privada": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "token GitHub": re.compile(r"gh[pousr]_[A-Za-z0-9_]{30,}"),
              "chave AWS": re.compile(r"AKIA[0-9A-Z]{16}"),
          }
          ignored = {".git"}
          findings = []

          for path in Path.cwd().rglob("*"):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(content):
                      findings.append(f"Possível {label} em {path}")

          if findings:
              raise SystemExit("\n".join(findings))
          print("Nenhuma credencial conhecida foi encontrada.")

  package:
    name: Package
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar a documentação
        uses: actions/download-artifact@v4
        with:
          name: site-documentacao
          path: dist

      - name: Empacotar e conferir a entrega
        run: |
          tar -czf documentacao-devops.tar.gz -C dist .
          tar -tzf documentacao-devops.tar.gz > /dev/null

      - name: Salvar o pacote
        uses: actions/upload-artifact@v4
        with:
          name: pacote-documentacao
          path: documentacao-devops.tar.gz
          retention-days: 7

  deploy:
    name: Deploy
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar a documentação
        uses: actions/download-artifact@v4
        with:
          name: site-documentacao
          path: dist

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  smoke-test:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a versão publicada
        uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Conferir arquivos essenciais
        run: |
          test -f index.md
          test -f Aula01/Tarefa01/Atividade01.md
          test -f Aula06/Tarefa06/Atividade06.md

  performance:
    name: Performance
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a versão publicada
        uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Validar o tamanho da documentação
        run: |
          SIZE=$(du -sk . --exclude=.git | cut -f1)
          echo "Tamanho total: ${SIZE} KB"
          test "$SIZE" -lt 51200

  monitoring:
    name: Monitoring
    needs: performance
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Confirmar a publicação
        run: |
          git ls-remote --exit-code origin refs/heads/gh-pages
          echo "Pipeline concluída e branch gh-pages disponível."
